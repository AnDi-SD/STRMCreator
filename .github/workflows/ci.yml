name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore STRMshelf.sln

      - name: Build
        run: dotnet build STRMshelf.sln -c Release --no-restore

      - name: Test
        run: dotnet test STRMshelf.sln -c Release --no-build
